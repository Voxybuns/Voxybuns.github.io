- category: "Sediment"
  contents:
  - name: "Ground"
    slug: "ground"
    desc: |
      The solid ground of the Planet and Moons.
      <br>Its appearance depends on the location and development status.
    obtain: |
      Ground covers the totality of Planetary Blocks and Moons. It can be created when:
      - A [Leveler Stone](#leveler-stone) is broken
      - [&nbsp;Concrete](#concrete) reacts with [&nbsp;Water](#water)
    break: |
      Ground can only be broken using a Hammer. Upon breaking, it yields nothing.

  - name: " Soil"
    slug: "soil"
    desc: |
      Used to grow [&nbsp;Seeds](#seed).
      <br>Fuses with adjacent [&nbsp;Clay](#clay) pieces.
    obtain: |
      Deposits of Soil generate abudantly on Planetary Blocks. It can also be found on certain Moons. Soil is obtained when:
      - [&nbsp;Magma](#magma) reacts to &nbsp;Frost
      - [&nbsp;Magma](#magma) reacts to [&nbsp;Ice](#ice)
      - [&nbsp;Magma](#magma) reacts to [&nbsp;Water](#water)
      - [&nbsp;Sand](#sand) reacts to [&nbsp;Water](#water)
    usage: |
      A [&nbsp;Seed](#seed) placed on top of Soil changes to a [&nbsp;Growing Seed](#growing-seed).
      <br>Changes to [&nbsp;Field Soil](#field-soil) when a Garden Hoe is used.
      <br>Changes to [&nbsp;Sand](#sand) when reacting to [&nbsp;Swamp](#swamp).
      <br>Stoneworker and <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Soil has low hardness. Upon breaking, it yields nothing.

  - name: " Field Soil"
    slug: "field-soil"
    desc: |
      Used to grow [&nbsp;Seeds](#seed) faster than regular [&nbsp;Soil](#soil).
      <br>Fuses with adjacent [&nbsp;Clay](#clay) pieces.
    obtain: |
      Field Soil generates naturally within deposits of [&nbsp;Soil](#soil). Field Soil is obtained when a Garden Hoe is used on [&nbsp;Soil](#soil).
    usage: |
      A [&nbsp;Seed](#seed) placed on top of Field Soil changes to a [&nbsp;Growing Seed](#growing-seed), and grows faster than regular Soil.
      <br>Changes to [&nbsp;Sand](#sand) when reacting to [&nbsp;Swamp](#swamp).
      <br>Stoneworker and <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Field Soil has higher hardness than [&nbsp;Soil](#soil). Upon breaking, it yields nothing.
    
  - name: " Sand"
    slug: "sand"
    desc: |
      <br>
    obtain: |
      Deposits of Sand generate abundantly on Planetary Blocks. It can also be found on certain Moons. Sand is obtained when:
      - [&nbsp;Soil](#soil) reacts to [&nbsp;Swamp](#swamp)
      - [&nbsp;Field Soil](#field-soil) reacts to [&nbsp;Swamp](#swamp)
      - [&nbsp;Grass](#grass) reacts to [&nbsp;Swamp](#swamp)
      - [&nbsp;Glass Spike](#glass-spike) reacts to [&nbsp;Swamp](#swamp)
      - [&nbsp;Glass](#glass) reacts to [&nbsp;Swamp](#swamp)
    usage: |
      Changes to [&nbsp;Glass Spike](#glass-spike) when reacting to [&nbsp;Magma](#magma).
      <br>Changes to [&nbsp;Soil](#soil) when reacting to [&nbsp;Water](#water).
      <br>Stoneworker and <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Sand has very low hardness. Upon breaking, it yields nothing, and adjacent Sand pieces also break.

  - name: " Clay"
    slug: "clay"
    desc: |
      Fuses with adjacent Clay, [&nbsp;Ceramic](#ceramic), [&nbsp;Soil](#soil), and [&nbsp;Field Soil](#field-soil) pieces.
    obtain: |
      Clay can be found on certain Moons. Clay is obtained when any type of Rock reacts to [&nbsp;Swamp](#swamp).
    usage: |
      Changes to [&nbsp;Ceramic](#ceramic) when reacting to [&nbsp;Magma](#magma).
      <br>Stoneworker and <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Clay has low hardness. Upon breaking, it yields nothing.

  - name: " Ceramic"
    slug: "ceramic"
    desc: |
      Fuses with adjacent [&nbsp;Clay](#clay) pieces.
    obtain: |
      Ceramic can be found on certain Moons. Ceramic is obtained when [&nbsp;Clay](#clay) reacts to [&nbsp;Magma](#magma).
    usage: |
      Stoneworker and <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Ceramic has medium hardness. Upon breaking, it yields nothing.

- category: "Plant"
  contents:
  - name: " Grass"
    slug: "grass"
    desc: |
      <br>
    obtain: |
      Grass generates naturally on Planetary Blocks. It can also be found on certain Moons. [&nbsp;Water](#water) creates Grass pieces when it cannot flow further.
    usage: |
      <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Grass has very low hardness. It breaks when a piece is placed on top, or when adjacent to [&nbsp;Magma](#magma). Upon breaking, it yields nothing.
  - name: " Tree Trunk"
    slug: "tree-trunk"
    desc: |
      A source of Wood cards found in trees.
    obtain: |
      Tree Trunks can be found on certain Moons. Tree Trunks are obtained when:
      - [&nbsp;Sprout](#sprout) reacts to [&nbsp;Water](#water), growing a tree
      - [&nbsp;Dead Wood](#dead-wood) reacts to [&nbsp;Water](#water) or developed [Ground](#ground)
      - [&nbsp;Tree Knots](#tree-knot) are struck, growing a tree further
      - Darkness is vainquished, growing a tree
    usage: |
      Changes to [&nbsp;Charcoal](#charcoal) when reacting to [&nbsp;Magma](#magma).
      <br>
      Changes to [&nbsp;Dead Wood](#dead-wood) when reacting to [&nbsp;Swamp](#swamp).
      <br>
      Woodworker and <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Tree Trunks have low hardness. Upon breaking, it yields a Wood card.

  - name: " Dead Wood"
    slug: "dead-wood"
    desc: |
      <br>
    obtain: |
      Dead Wood can be found in Planetary Blocks as part of Broot trees. Dead Wood is obtained when:
      - [&nbsp;Tree Trunks](#tree-trunk) react to [&nbsp;Swamp](#swamp)
    usage: |
      Changes to [&nbsp;Tree Trunk](#tree-trunk) when reacting to [&nbsp;Water](#water) or placed on developed [Ground](#ground).
      <br>
      Changes to [&nbsp;Charcoal](#charcoal) when reacting to [&nbsp;Magma](#magma).
      <br>
      Woodworker and <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Dead Wood has the same hardness as [&nbsp;Tree Trunks](#tree-trunk). Upon breaking, it yields a Wood card.

  - name: " Tree Leaf"
    slug: "tree-leaf"
    desc: |
      A source of Wood cards and Noots found in trees.
    obtain: |
      Tree Leaves can be found on certain Moons. Tree Leaves are obtained when:
      - [&nbsp;Sprout](#sprout) reacts to [&nbsp;Water](#water), growing a tree
      - [&nbsp;Dead Leaf](#dead-leaf) reacts to [&nbsp;Water](#water) or developed [Ground](#ground)
      - [&nbsp;Tree Knots](#tree-knot) are struck, growing a tree further
      - Darkness is vainquished, growing a tree
    usage: |
      Changes to [&nbsp;Charcoal](#charcoal) when reacting to [&nbsp;Magma](#magma).
      <br>
      Changes to [&nbsp;Dead Leaf](#dead-leaf) when reacting to [&nbsp;Swamp](#swamp).
      <br>
      Woodworker and <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Tree Leaves have low hardness. Upon breaking, it yields a Wood card and has a chance to spawn a Noot.

  - name: " Dead Leaf"
    slug: "dead-leaf"
    desc: |
      Breaks when stepped on.
    obtain: |
      Dead Leaves are obtained when [&nbsp;Tree Leaves](#tree-leaf) react to [&nbsp;Swamp](#swamp)
    usage: |
      Changes to [&nbsp;Tree Leaf](#tree-leaf) when reacting to [&nbsp;Water](#water) or placed on developed [Ground](#ground).
      <br>
      <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Dead Leaves have very low hardness. They break when stepped on. Breaking them also breaks adjacent fragile pieces. Upon breaking, it yields a Wood card.

  - name: " Tree Knot"
    slug: "tree-knot"
    desc: |
      Grows branches when struck.
    obtain: |
      Tree Knots are obtained when a tree grows from a [&nbsp;Sprout](#sprout) or defeating Darkness.
    usage: |
      Tree Knots turn into [&nbsp;Tree Trunks](#tree-trunk) if unfused and placed elsewhere.
      <br>
      Changes to [&nbsp;Charcoal](#charcoal) when reacting to [&nbsp;Magma](#magma).
      <br>
      Changes to [&nbsp;Dead Wood](#dead-wood) when reacting to [&nbsp;Swamp](#swamp).
      <br>
      <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Tree Knots have the same hardness as [&nbsp;Tree Trunks](#tree-trunk). When struck, a tree branch grows in its place.

  - name: " Seed"
    slug: "seed"
    desc: |
      Used to grow a Used to obtain a [&nbsp;Sprout](#sprout) or regain health.
    obtain: |
      Seeds have a chance to spawn on the canopy of a tree when it grows.
    usage: |
      Changes to [&nbsp;Growing Seed](#growing-seed) when placed on top of [&nbsp;Soil](#soil) or [&nbsp;Field Soil](#field-soil).
      <br>
      <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Seeds have low hardness. Upon breaking, they grant half a heart worth of health to the player who broke them.

  - name: " Growing Seed"
    slug: "growing-seed"
    desc: |
      A [&nbsp;Seed](#seed) that has been planted. Changes to a [&nbsp;Buried Sprout](#buried-sprout) after some time.
    obtain: |
      Growing Seeds are obtained when a [&nbsp;Seed](#seed) is placed on top of [&nbsp;Soil](#soil) or [&nbsp;Field Soil](#field-soil). 
    usage: |
      Changes to [&nbsp;Buried Sprout](#buried-sprout) after a certain duration has passed, which depends on whether it was planted on [&nbsp;Soil](#soil) or [&nbsp;Field Soil](#field-soil).
      <br>
      <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Growing Seeds have low hardness. Upon breaking, they yield nothing.

  - name: " Buried Sprout"
    slug: "buried-sprout"
    desc: |
      A [&nbsp;Seed](#seed) that has fully grown. Used to obtain a [&nbsp;Sprout](#sprout).
    obtain: |
      Buried Sprouts are obtained when [&nbsp;Growing Seed](#growing-seed) have fully developed after an amount of time.
    usage: |
      <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Growing Seeds have low hardness. Upon breaking, they turn to a [&nbsp;Sprout](#sprout).

  - name: " Sprout"
    slug: "sprout"
    desc: |
      Used to grow a tree.
    obtain: |
      Sprouts have a chance to spawn on the canopy of a tree. Sprouts can be obtained when a [&nbsp;Buried Sprout](#buried-sprout) is broken.
    usage: |
      Grows a tree when reacting to [&nbsp;Water](#water). The type of tree is randomly assigned when the Sprout is created, and is indicated on the top side of the piece.
      <br>
      <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Sprouts have low hardness. Upon breaking, they yield nothing.

  - name: " Berry"
    slug: "berry"
    desc: |
      Used to obtain [&nbsp;Water](#water).
    obtain: |
      Berries have a chance to spawn on the canopy of a tree when it grows.
    usage: |
      Changes to [&nbsp;Rotten Berry](#rotten-berry) when reacting to [&nbsp;Swamp](#swamp).
      <br><dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Berries have low hardness. Breaking them shoots a [&nbsp;Water](#water) droplet which turns into a piece when landing. Upon breaking, they yield nothing.

  - name: " Rotten Berry"
    slug: "rotten-berry"
    desc: |
      Used to obtain [&nbsp;Swamp](#swamp).
    obtain: |
      Rotten Berry are obtained when [&nbsp;Berries](#berry) react to [&nbsp;Swamp](#swamp).
    usage: |
      <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Rotten Berries have the same hardness as [&nbsp;Berries](#berry). Breaking them shoots a [&nbsp;Swamp](#swamp) droplet which turns into a piece when landing. Upon breaking, they yield nothing.


  - name: " Charcoal"
    slug: "charcoal"
    desc: |
      Used to obtain Charcoal cards.
    obtain: |
      Charcoal is obtained when:
      - [&nbsp;Tree Trunks](#tree-trunk) react to [&nbsp;Magma](#magma).
      - [&nbsp;Dead Wood](#dead-wood) reacts to [&nbsp;Magma](#magma).
      - [&nbsp;Tree Leaves](#tree-leaf) react to [&nbsp;Magma](#magma).
    usage: |
      Woodworker and <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Charcoal has lower durability than [&nbsp;Tree Trunks](#tree-trunk). Upon breaking, it yields a Charcoal card.


- category: "Rock"
  contents:
  - name: " Raw Ore"
    slug: "raw-ore"
    desc: |
      Can be mined for a chance to obtain Stone.
    obtain: |
      Deposits of Raw Ore generate on Planetary Blocks and certain Moons. Raw Ore is obtained by:
      - Breaking a [Pillar Stone](#pillar-stone)
      - Breaking a [Platform Stone](#platform-stone)
      - Breaking a [Stair Stone](#stair-stone)
    usage: |
      Changes to [&nbsp;Clay](#clay) when reacing to [&nbsp;Swamp](#swamp).
      <br>
      Fuses with adjacent Rock pieces when reacting to [&nbsp;Magma](#magma).
      <br>Stoneworker and <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Raw Ore has medium hardness. Upon breaking, it has a random chance to change to [&nbsp;Stone](#stone), [&nbsp;Junk Stone](#junk-stone), [&nbsp;Broot Egg](#broot-egg), or a level 1 [&nbsp;Bomb](#bomb).
  - name: " Stone"
    slug: "stone"
    desc: |
      Used to obtain Stone cards.
    obtain: |
      Stone can be found within deposits of [&nbsp;Raw Ore](#raw-ore). Stone has a chance to appear when [&nbsp;Raw Ore](#raw-ore) is broken.
    usage: |
      Changes to [&nbsp;Clay](#clay) when reacing to [&nbsp;Swamp](#swamp).
      <br>
      Fuses with adjacent Rock pieces when reacting to [&nbsp;Magma](#magma).
      <br>Stoneworker and <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Stone has the same hardness as [&nbsp;Raw Ore](#raw-ore). Breaking it breaks adjacent [&nbsp;Raw Ore](#raw-ore) pieces. Upon breaking, it yields a Stone card.
  - name: " Junk Stone"
    slug: "junk-stone"
    desc: |
      <br>
    obtain: |
      Junk Stone has a chance to appear when [&nbsp;Raw Ore](#raw-ore) is broken.
    usage: |
      Changes to [&nbsp;Clay](#clay) when reacing to [&nbsp;Swamp](#swamp).
      <br>
      Fuses with adjacent Rock pieces when reacting to [&nbsp;Magma](#magma).
      <br>Stoneworker and <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
    break: |
      Junk Stone has the same hardness as [&nbsp;Raw Ore](#raw-ore). Breaking it breaks adjacent ore pieces. Upon breaking, it yields nothing.
