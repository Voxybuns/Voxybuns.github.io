        <br>
        <dfn title="Fantasy Crafter, Fashion Designer, Confectioner, Sushi Chef, Cake Maker, Dev-Core Crafter">Artisan</dfn> outfits can be used to apply a pattern on this piece.
      break: |
        Dev Stones have very low hardness. Breaking them releases developing light in a radius corresponding to the altitude at which it was broken. Upon breaking, they yield a Dev Stone card.
    - name: " Life Stone"
