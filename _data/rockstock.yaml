        - Obtaining them from Daily Supplies at the Dev Core
        - Defeating a Darkness-born Oot
        - Completing a Gate of Darkness
        - Completing a Drop of Darkness
        - Completing a Darkness Puzzle
        - Randomly appearing on the canopy of trees
      usage: |
