- category: "Elemental"
  contents:
    - name: " Water"
      slug: "water"
      desc: |
        Used to grow Sprouts.
      obtain: |
        Water can be found in rivers or lakes on Planetary Blocks and certain Moons. Water is obtained when a [&nbsp;Berry](#berry) is broken.
      usage: |
        When placed or when an adjacent non-Water piece is broken, Water will attempt to spread outwards. After 4 successful attempts, it causes [&nbsp;Grass](#grass) to appear.
        <br>
        Changes to [&nbsp;Ice](#ice) when reacting to [&nbsp;Ice](#ice) or Frost.
        <br>
        Changes [&nbsp;Sand](#sand) to [&nbsp;Soil](#soil).
        <br>
        Changes [&nbsp;Dead Wood](#dead-wood) to [&nbsp;Tree Trunk](#tree-trunk).
        <br>
        Changes [&nbsp;Dead Leaf](#dead-leaf) to [&nbsp;Tree Leaf](#tree-leaf)
        <br>
        Grows a [&nbsp;Sprout](#sprout) into a tree.
        <br>
        Its pattern cannot be changed.
      break:
        Water breaks instantly. Breaking it breaks adjacent Water pieces in a radius. Upon breaking, it yields nothing.
    - name: " Magma"
      slug: "magma"
      desc: |
        Fuses Metal and Rock. Deals damage when touched.
      obtain: |
        Magma can be found in lakes on Planetary Blocks and certain Moons.
      usage: |
        Magma deals damage when touched unless the player is in a vehicle.
        <br>
        When placed or when an adjacent non-Magma piece is broken, Magma will attempt to spread outwards. After 4 successful attempts, it causes [&nbsp;Soil](#soil) to appear.
        <br>
        Changes to [&nbsp;Ash](#ash) when reacting to [&nbsp;Swamp](#swamp).
        <br>
        Destroys adjacent [&nbsp;Grass](#grass) pieces.
        <br>
        Adjacent Metal and Rock pieces are fused together.
        <br>
        Changes [&nbsp;Clay](#clay) to [&nbsp;Ceramic](#ceramic).
        <br>
        Changes [&nbsp;Sand](#sand) to [&nbsp;Glass Spike](#glass-spike).
        <br>
        Changes [&nbsp;Tree Trunk](#tree-trunk) to [&nbsp;Charcoal](#charcoal)l.
        <br>
        Changes [&nbsp;Dead Wood](#dead-wood) to [&nbsp;Charcoal](#charcoal).
        <br>
        Changes [&nbsp;Tree Leaf](#tree-leaf) to [&nbsp;Charcoal](#charcoal).
        <br>
        Its pattern cannot be changed.
      break:
        Magma breaks instantly. Breaking it breaks adjacent Magma pieces in a radius. Upon breaking, it yields nothing.
    - name: " Swamp"
      slug: "swamp"
      desc: |
        Drains energy when walked on.
      obtain: |
        Swamp can be found in lakes on Planetary Blocks and certain Moons. Swamp is obtained when a [&nbsp;Rotten Berry](#rotten-berry) is broken.
      usage: |
        When walked on or driven on, the player's energy rapidly drains.
        <br>
        When placed or when an adjacent non-Swamp piece is broken, Swamp will attempt to spread outwards. After 4 successful attempts, it causes [&nbsp;Sand](#sand) to appear.
        <br>
        Changes [&nbsp;Soil](#soil) to [&nbsp;Sand](#sand).
        <br>
        Changes [&nbsp;Field Soil](#field-soil) to [&nbsp;Sand](#sand).
        <br>
        Changes [&nbsp;Grass](#grass) to [&nbsp;Sand](#sand).
        <br>
        Changes [&nbsp;Tree Trunk](#tree-trunk) to [&nbsp;Dead Wood](#dead-wood).
        <br>
        Changes [&nbsp;Tree Leaf](#tree-leaf) to [&nbsp;Dead Leaf](#dead-leaf).
        <br>
        Changes all Rock pieces to [&nbsp;Clay](#clay).
        <br>
        Changes [&nbsp;Magma](#magma) to [&nbsp;Ash](#ash).
        <br>
        Changes [&nbsp;Glass Spike](#glass-spike) to [&nbsp;Sand](#sand).
        <br>
        Changes [&nbsp;Glass](#glass) to [&nbsp;Sand](#sand).
        <br>
        Its pattern cannot be changed.
      break:
        Swamp breaks instantly. Breaking it breaks adjacent Swamp pieces in a radius. Upon breaking, it yields nothing.
    - name: " Ash"
      slug: "ash"
      desc: |
        Used to create [&nbsp;Smoke](#smoke).
      obtain: |
        Ash is obtained when [&nbsp;Magma](#magma) reacts to [&nbsp;Swamp](#swamp).
      usage: |
        Its pattern cannot be changed.
      break: |
        Ash has very low hardness. Breaking it releases [&nbsp;Smoke](#smoke) in a small radius. Upon breaking, it yields nothing.
    - name: " Smoke"
      slug: "smoke"
      desc: |
        Disappears after a few seconds. Produces an Explosion when hit.
      obtain: |
        Smoke is obtained when [&nbsp;Ash](#ash) is broken.
      usage: |
        When placed, Smoke spreads outwards to form a cloud, and disappears after a few seconds.
        <br>
        Changes to [&nbsp;Cloud](#cloud) when reacting to Frost.
        <br>
        Its pattern cannot be changed.
      break: |
        Smoke breaks instantly. Breaking it produces an Explosion. Upon breaking, it yields nothing.
    - name: " Cloud"
      slug: "cloud"
      desc: |
        Floats in mid-air. Produces Electricity when hit.
      obtain: |
        Clouds generate on Planetary Blocks and Moons. Cloud is obtained when [&nbsp;Smoke](#smoke) reacts to Frost.
      use: |
        Unlike most other pieces, Cloud is not affected by gravity.
        <br>
        Its pattern cannot be changed.
      break: |
        Cloud breaks instantly. Breaking it produces Electricity. Upon breaking, it yields nothing.
    - name: " Ice"
      slug: "ice"
      desc: |
        Walking on it feels slippery. Produces Frost when hit.
      obtain: |
        Ice can be found on certain Moons. Ice is obtained when [&nbsp;Water](#water) reacts to [&nbsp;Ice](#ice) or Frost.
      usage: |
        Ice is slippery, causing the player to slide after walking on it.
        <br>
        Changes [&nbsp;Water](#water) to Ice.
      break: |
        Ice has low hardness. Breaking it releases a cloud of Frost. Upon breaking, it yields nothing.
